name: CI

on:
  push:
    branches: [master, 'codex/**']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Build the guest component once; every host job consumes these exact bytes.
  guest:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
      calculator_sha256: ${{ steps.calculator_hash.outputs.sha256 }}
      todo_sha256: ${{ steps.todo_hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Build guest and containment components
        run: >-
          cargo build
          -p youth-counter
          -p youth-sdk-tally
          -p youth-sdk-todo
          -p youth-trap-on-mount
          -p youth-trap-on-handle
          -p youth-invalid-snapshot
          -p youth-invalid-patch
          -p youth-infinite-loop
          -p youth-memory-bomb
          -p youth-invalid-revision
          -p youth-invalid-sequence
          -p youth-oversized-snapshot
          -p youth-oversized-patch
          -p youth-trap-after-state-write
          -p youth-invalid-patch-after-state-write
          -p youth-bad-revision-after-state-write
          -p youth-app-error-after-state-write
          -p youth-countdown-presentation
          -p youth-editor-v006
          -p youth-editor-capability-v006
          -p youth-elapsed-invalid-patch
          -p youth-elapsed-trap
          -p youth-instant-now
          -p youth-legacy-v003
          -p youth-sdk-elapsed
          -p youth-sdk-time
          -p youth-sdk-editor
          -p youth-sdk-text-document
          -p youth-shortcut-primary-v007
          -p youth-time-stub
          --target wasm32-wasip2 --release
      - name: Record SHA-256
        id: hash
        run: |
          digest=$(sha256sum target/wasm32-wasip2/release/youth_counter.wasm | cut -d' ' -f1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "counter.wasm SHA-256: $digest"
      - name: Build calculator component once
        env:
          CALCULATOR_COMMIT: 696d2fbac58a99116fec28238ca51f5a4a5c2acd
        run: |
          set -euo pipefail
          calculator="$RUNNER_TEMP/youth-calculator"
          git clone --quiet https://github.com/samanshaiza004/youth-calculator.git "$calculator"
          git -C "$calculator" checkout --quiet "$CALCULATOR_COMMIT"
          cargo build \
            --manifest-path "$calculator/Cargo.toml" \
            --target-dir "$GITHUB_WORKSPACE/target/calculator-external" \
            --target wasm32-wasip2 \
            --release
      - name: Record calculator SHA-256
        id: calculator_hash
        env:
          CALCULATOR_COMMIT: 696d2fbac58a99116fec28238ca51f5a4a5c2acd
          YOUTH_COMMIT: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          component=target/calculator-external/wasm32-wasip2/release/calculator.wasm
          test -f "$component"
          digest=$(sha256sum "$component" | cut -d' ' -f1)
          bytes=$(stat -c '%s' "$component")
          calculator="$RUNNER_TEMP/youth-calculator"
          protocol=$(awk -F'"' '/^protocol[[:space:]]*=/{print $2; exit}' "$calculator/Youth.lock")
          sdk_revision=$(awk -F'"' '/^sdk-revision[[:space:]]*=/{print $2; exit}' "$calculator/Youth.lock")
          wit_sha256=$(awk -F'"' '/^wit-sha256[[:space:]]*=/{print $2; exit}' "$calculator/Youth.lock")
          rustc_version=$(rustc --version)
          cargo_version=$(cargo --version)
          export CALCULATOR_COMMIT YOUTH_COMMIT CI_RUN_ID digest bytes protocol sdk_revision wit_sha256 rustc_version cargo_version
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "app_id": "dev.saman.calculator",
              "app_commit": os.environ["CALCULATOR_COMMIT"],
              "youth_commit": os.environ["YOUTH_COMMIT"],
              "sdk_revision": os.environ["sdk_revision"],
              "protocol": os.environ["protocol"],
              "wit_sha256": os.environ["wit_sha256"],
              "component_sha256": os.environ["digest"],
              "component_bytes": int(os.environ["bytes"]),
              "rustc": os.environ["rustc_version"],
              "cargo": os.environ["cargo_version"],
              "build_profile": "release",
              "canonical_builder": "ubuntu-x86_64",
              "build_command": "cargo build --manifest-path <calculator>/Cargo.toml --target wasm32-wasip2 --release",
              "ci_run_id": int(os.environ["CI_RUN_ID"]),
              "supported_contract_profiles": ["youth:app@0.0.3"],
          }
          output = Path("target/calculator-external/calculator-canonical-manifest.json")
          output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          mkdir -p target/calculator-certified-artifact
          cp "$component" target/calculator-certified-artifact/calculator.wasm
          cp target/calculator-external/calculator-canonical-manifest.json target/calculator-certified-artifact/
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "calculator.wasm SHA-256: $digest ($bytes bytes)"
      - name: Build Todo component once
        env:
          TODO_COMMIT: 632e20cb569d862139a09a48622b317e04b7238a
        run: |
          set -euo pipefail
          todo="$RUNNER_TEMP/youth-todo"
          git clone --quiet https://github.com/samanshaiza004/youth-todo.git "$todo"
          git -C "$todo" checkout --quiet "$TODO_COMMIT"
          cargo build \
            --manifest-path "$todo/Cargo.toml" \
            --target-dir "$GITHUB_WORKSPACE/target/todo-external" \
            --target wasm32-wasip2 \
            --release \
            --locked
      - name: Record Todo SHA-256
        id: todo_hash
        env:
          TODO_COMMIT: 632e20cb569d862139a09a48622b317e04b7238a
          YOUTH_COMMIT: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          component=target/todo-external/wasm32-wasip2/release/youth_todo.wasm
          test -f "$component"
          digest=$(sha256sum "$component" | cut -d' ' -f1)
          bytes=$(stat -c '%s' "$component")
          todo="$RUNNER_TEMP/youth-todo"
          protocol=$(awk -F'"' '/^protocol[[:space:]]*=/{print $2; exit}' "$todo/Youth.lock")
          sdk_revision=$(awk -F'"' '/^sdk-revision[[:space:]]*=/{print $2; exit}' "$todo/Youth.lock")
          wit_sha256=$(awk -F'"' '/^wit-sha256[[:space:]]*=/{print $2; exit}' "$todo/Youth.lock")
          rustc_version=$(rustc --version)
          cargo_version=$(cargo --version)
          export TODO_COMMIT YOUTH_COMMIT CI_RUN_ID digest bytes protocol sdk_revision wit_sha256 rustc_version cargo_version
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "app_id": "dev.saman.todo",
              "app_commit": os.environ["TODO_COMMIT"],
              "youth_commit": os.environ["YOUTH_COMMIT"],
              "sdk_revision": os.environ["sdk_revision"],
              "protocol": os.environ["protocol"],
              "wit_sha256": os.environ["wit_sha256"],
              "component_sha256": os.environ["digest"],
              "component_bytes": int(os.environ["bytes"]),
              "rustc": os.environ["rustc_version"],
              "cargo": os.environ["cargo_version"],
              "build_profile": "release",
              "canonical_builder": "ubuntu-x86_64",
              "build_command": "cargo build --manifest-path <todo>/Cargo.toml --target wasm32-wasip2 --release",
              "ci_run_id": int(os.environ["CI_RUN_ID"]),
              "supported_contract_profiles": ["youth:app@0.0.5"],
              "reproducible_builds_claimed": False,
          }
          output = Path("target/todo-external/todo-canonical-manifest.json")
          output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          mkdir -p target/todo-certified-artifact
          cp "$component" target/todo-certified-artifact/todo.wasm
          cp target/todo-external/todo-canonical-manifest.json target/todo-certified-artifact/
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "todo.wasm SHA-256: $digest ($bytes bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: counter-wasm
          path: |
            target/wasm32-wasip2/release/youth_counter.wasm
            target/wasm32-wasip2/release/youth_sdk_tally.wasm
            target/wasm32-wasip2/release/youth_sdk_todo.wasm
            target/wasm32-wasip2/release/youth_trap_on_mount.wasm
            target/wasm32-wasip2/release/youth_trap_on_handle.wasm
            target/wasm32-wasip2/release/youth_invalid_snapshot.wasm
            target/wasm32-wasip2/release/youth_invalid_patch.wasm
            target/wasm32-wasip2/release/youth_infinite_loop.wasm
            target/wasm32-wasip2/release/youth_memory_bomb.wasm
            target/wasm32-wasip2/release/youth_invalid_revision.wasm
            target/wasm32-wasip2/release/youth_invalid_sequence.wasm
            target/wasm32-wasip2/release/youth_oversized_snapshot.wasm
            target/wasm32-wasip2/release/youth_oversized_patch.wasm
            target/wasm32-wasip2/release/youth_trap_after_state_write.wasm
            target/wasm32-wasip2/release/youth_invalid_patch_after_state_write.wasm
            target/wasm32-wasip2/release/youth_bad_revision_after_state_write.wasm
            target/wasm32-wasip2/release/youth_app_error_after_state_write.wasm
            target/wasm32-wasip2/release/youth_countdown_presentation.wasm
            target/wasm32-wasip2/release/youth_editor_v006.wasm
            target/wasm32-wasip2/release/youth_editor_capability_v006.wasm
            target/wasm32-wasip2/release/youth_elapsed_invalid_patch.wasm
            target/wasm32-wasip2/release/youth_elapsed_trap.wasm
            target/wasm32-wasip2/release/youth_instant_now.wasm
            target/wasm32-wasip2/release/youth_legacy_v003.wasm
            target/wasm32-wasip2/release/youth_sdk_elapsed.wasm
            target/wasm32-wasip2/release/youth_sdk_time.wasm
            target/wasm32-wasip2/release/youth_sdk_editor.wasm
            target/wasm32-wasip2/release/youth_sdk_text_document.wasm
            target/wasm32-wasip2/release/youth_shortcut_primary_v007.wasm
            target/wasm32-wasip2/release/youth_time_stub.wasm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-wasm
          path: target/calculator-certified-artifact/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: todo-wasm
          path: target/todo-certified-artifact/*
          if-no-files-found: error

  host:
    needs: guest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # windows-latest runners have repeatedly shown DeadlineExceeded false
      # positives on legitimate guest calls (SQLite I/O, Parley layout)
      # under scheduling contention -- never on ubuntu-latest/macos-latest.
      # This widens only the wall-clock deadline (never fuel) on that one
      # leg; see crates/youth-runtime/src/limits.rs's call_deadline_scale.
      YOUTH_CALL_DEADLINE_SCALE: ${{ matrix.os == 'windows-latest' && '10' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@wasm-tools
      - uses: taiki-e/install-action@mdbook
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev
      - uses: actions/download-artifact@v4
        with:
          name: counter-wasm
          path: target/wasm32-wasip2/release
      - uses: actions/download-artifact@v4
        with:
          name: calculator-wasm
          path: target/calculator-certified
      - uses: actions/download-artifact@v4
        with:
          name: todo-wasm
          path: target/todo-certified
      - name: Verify guest SHA-256
        shell: pwsh
        run: |
          $component = "target/wasm32-wasip2/release/youth_counter.wasm"
          $actual = (Get-FileHash $component -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "${{ needs.guest.outputs.sha256 }}".ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "counter.wasm SHA-256 mismatch: expected $expected, got $actual"
          }
          Write-Host "counter.wasm SHA-256: $actual"
      - name: Validate component
        run: wasm-tools validate target/wasm32-wasip2/release/youth_counter.wasm
      - name: Inspect component WIT
        run: wasm-tools component wit target/wasm32-wasip2/release/youth_counter.wasm
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test, including transaction failpoints
        run: cargo test --workspace --features youth-runtime/test-support
      - name: SDK documentation and doctests
        run: cargo doc -p youth-sdk --no-deps && cargo test -p youth-sdk --doc
      - name: Developer guide
        run: mdbook build docs/book
      - name: Deterministic framebuffer fixture
        run: cargo test -p youth-desktop raster::tests::raw_frame_fixtures_are_deterministic
      - name: Cross-platform canonical snapshot gate
        shell: pwsh
        run: |
          $start = [Diagnostics.ProcessStartInfo]::new()
          $start.FileName = "cargo"
          $start.ArgumentList.Add("run")
          $start.ArgumentList.Add("--quiet")
          $start.ArgumentList.Add("-p")
          $start.ArgumentList.Add("youth-cli")
          $start.ArgumentList.Add("--")
          $start.ArgumentList.Add("script")
          $start.ArgumentList.Add("target/wasm32-wasip2/release/youth_counter.wasm")
          $start.ArgumentList.Add("tests/scripts/three-clicks.json")
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $start.StandardOutputEncoding = [Text.Encoding]::UTF8
          $start.StandardErrorEncoding = [Text.Encoding]::UTF8
          $process = [Diagnostics.Process]::Start($start)
          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) {
            throw "youth script failed with exit code $($process.ExitCode): $stderr"
          }
          # Compared byte-for-byte on purpose. The canonical format is LF
          # only, .gitattributes keeps the fixture LF on every checkout, and
          # Rust's println! never emits CRLF -- so normalizing here would
          # hide a real determinism regression rather than tolerate noise.
          $expected = [IO.File]::ReadAllText("tests/fixtures/three-clicks.expected")
          if ($stdout -ne $expected) {
            throw "canonical snapshot differs from tests/fixtures/three-clicks.expected"
          }
          $utf8 = [Text.UTF8Encoding]::new($false)
          $actualPath = Join-Path $env:RUNNER_TEMP "three-clicks.actual"
          $expectedPath = Join-Path $env:RUNNER_TEMP "three-clicks.expected"
          [IO.File]::WriteAllText($actualPath, $stdout, $utf8)
          [IO.File]::WriteAllText($expectedPath, $expected, $utf8)
          $actualHash = (Get-FileHash $actualPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = (Get-FileHash $expectedPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "canonical snapshot SHA-256 mismatch: expected $expectedHash, got $actualHash"
          }
          Write-Host "canonical snapshot SHA-256: $actualHash"
      - name: Build (release)
        run: |
          # The CLI embeds reviewable template files. Clear cached package
          # artifacts so a restored target directory cannot retain an older
          # embedded WIT hash across branch commits.
          cargo clean -p youth-cli
          cargo clean -p youth-project
          cargo build --workspace --release
      - name: Native doctor smoke (Ubuntu/Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run --quiet -p youth-cli --release -- doctor --full
      - name: Native doctor smoke (hosted desktop)
        if: runner.os != 'Linux'
        run: cargo run --quiet -p youth-cli --release -- doctor --full
      - name: External generated project workflow
        shell: pwsh
        run: |
          $cliName = if ($IsWindows) { "youth.exe" } else { "youth" }
          $cli = (Resolve-Path (Join-Path "target/release" $cliName)).Path
          $externalRoot = Join-Path $env:RUNNER_TEMP "youth-external"
          New-Item -ItemType Directory -Force -Path $externalRoot | Out-Null
          $external = Join-Path $externalRoot "tally"
          & $cli doctor
          if ($LASTEXITCODE -ne 0) { throw "youth doctor failed" }
          & $cli new $external --id dev.saman.ci-tally
          if ($LASTEXITCODE -ne 0) { throw "youth new failed" }
          Push-Location $external
          try {
            & $cli check
            if ($LASTEXITCODE -ne 0) { throw "youth check failed" }
            & $cli test
            if ($LASTEXITCODE -ne 0) { throw "youth test failed" }
            & $cli build --release
            if ($LASTEXITCODE -ne 0) { throw "youth build --release failed" }
            if (Select-String -Path Cargo.toml -Pattern 'path\s*=') {
              throw "generated Cargo.toml contains a local path dependency"
            }
          } finally {
            Pop-Location
          }
      - name: External calculator workflow
        shell: pwsh
        env:
          CALCULATOR_COMMIT: 696d2fbac58a99116fec28238ca51f5a4a5c2acd
        run: |
          $cliName = if ($IsWindows) { "youth.exe" } else { "youth" }
          $cli = (Resolve-Path (Join-Path "target/release" $cliName)).Path
          $certifiedComponent = (Resolve-Path "target/calculator-certified/calculator.wasm").Path
          $certifiedHash = (Get-FileHash $certifiedComponent -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = "${{ needs.guest.outputs.calculator_sha256 }}".ToLowerInvariant()
          $manifestPath = (Resolve-Path "target/calculator-certified/calculator-canonical-manifest.json").Path
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.app_id -ne "dev.saman.calculator") {
            throw "canonical calculator manifest app ID is unexpected: $($manifest.app_id)"
          }
          if ($manifest.app_commit -ne $env:CALCULATOR_COMMIT) {
            throw "canonical calculator manifest app commit mismatch: expected $env:CALCULATOR_COMMIT, got $($manifest.app_commit)"
          }
          if ($manifest.protocol -ne "0.0.3") {
            throw "canonical calculator manifest protocol is unexpected: $($manifest.protocol)"
          }
          if ($manifest.component_sha256 -ne $expectedHash) {
            throw "canonical calculator manifest mismatch: expected $expectedHash, got $($manifest.component_sha256)"
          }
          if ([int64]$manifest.component_bytes -ne (Get-Item $certifiedComponent).Length) {
            throw "canonical calculator manifest byte count does not match the downloaded component"
          }
          if ($certifiedHash -ne $expectedHash) {
            throw "certified calculator SHA-256 mismatch: expected $expectedHash, got $certifiedHash"
          }
          Write-Host "calculator certified SHA-256: expected $expectedHash, observed $certifiedHash"
          & $cli mount $certifiedComponent
          if ($LASTEXITCODE -ne 0) { throw "certified calculator mount failed" }
          $calculator = Join-Path $env:RUNNER_TEMP "youth-calculator"
          git clone --quiet https://github.com/samanshaiza004/youth-calculator.git $calculator
          git -C $calculator checkout --quiet $env:CALCULATOR_COMMIT
          $checkedOut = (git -C $calculator rev-parse HEAD).Trim()
          if ($checkedOut -ne $env:CALCULATOR_COMMIT) {
            throw "calculator revision mismatch: expected $env:CALCULATOR_COMMIT, got $checkedOut"
          }
          Push-Location $calculator
          try {
            & $cli check
            if ($LASTEXITCODE -ne 0) { throw "calculator youth check failed" }
            & $cli test
            if ($LASTEXITCODE -ne 0) { throw "calculator youth test failed" }
            & $cli build --release
            if ($LASTEXITCODE -ne 0) { throw "calculator youth build --release failed" }
            $component = Join-Path $calculator "dist/dev.saman.calculator.wasm"
            if (-not (Test-Path $component -PathType Leaf)) {
              throw "calculator release component was not produced"
            }
            & wasm-tools validate $component
            if ($LASTEXITCODE -ne 0) { throw "calculator component validation failed" }
            if (Select-String -Path Cargo.toml -Pattern 'path\s*=') {
              throw "calculator Cargo.toml contains a local path dependency"
            }
            $forbidden = 'wit_bindgen|wasmtime|PatchBatch|acknowledg|numeric wire|revision|component export'
            $source = Get-ChildItem src -Recurse -File -Filter *.rs
            if ($source | Select-String -Pattern $forbidden) {
              throw "calculator source contains raw Youth runtime or WIT concepts"
            }
            $lock = Get-Content Youth.lock -Raw
            if ($lock -notmatch 'sdk-revision\s*=\s*"8696bd97ebc4f1d34b9f632e5992dd1882b724de"') {
              throw "calculator Youth.lock does not pin the certified SDK revision"
            }
            $localHash = (Get-FileHash $component -Algorithm SHA256).Hash.ToLowerInvariant()
            $metadata = Join-Path $env:RUNNER_TEMP "calculator-sha-$env:RUNNER_OS.txt"
            Set-Content -Path $metadata -Value $certifiedHash -NoNewline
            Write-Host "calculator certified revision: $checkedOut"
            Write-Host "calculator component bytes: $((Get-Item $component).Length)"
            Write-Host "calculator locally-built SHA-256: $localHash"
            Write-Host "calculator certified SHA-256: $certifiedHash"
          } finally {
            Pop-Location
          }
      - name: Upload calculator identity
        uses: actions/upload-artifact@v4
        with:
          name: calculator-sha-${{ runner.os }}
          path: ${{ runner.temp }}/calculator-sha-${{ runner.os }}.txt
          if-no-files-found: error
      - name: External Todo workflow
        shell: pwsh
        env:
          TODO_COMMIT: 632e20cb569d862139a09a48622b317e04b7238a
        run: |
          $cliName = if ($IsWindows) { "youth.exe" } else { "youth" }
          $cli = (Resolve-Path (Join-Path "target/release" $cliName)).Path
          $certifiedComponent = (Resolve-Path "target/todo-certified/todo.wasm").Path
          $certifiedHash = (Get-FileHash $certifiedComponent -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = "${{ needs.guest.outputs.todo_sha256 }}".ToLowerInvariant()
          $manifestPath = (Resolve-Path "target/todo-certified/todo-canonical-manifest.json").Path
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.app_id -ne "dev.saman.todo") {
            throw "canonical Todo manifest app ID is unexpected: $($manifest.app_id)"
          }
          if ($manifest.app_commit -ne $env:TODO_COMMIT) {
            throw "canonical Todo manifest app commit mismatch: expected $env:TODO_COMMIT, got $($manifest.app_commit)"
          }
          if ($manifest.protocol -ne "0.0.5") {
            throw "canonical Todo manifest protocol is unexpected: $($manifest.protocol)"
          }
          if ($manifest.component_sha256 -ne $expectedHash) {
            throw "canonical Todo manifest hash mismatch: expected $expectedHash, got $($manifest.component_sha256)"
          }
          if ([int64]$manifest.component_bytes -ne (Get-Item $certifiedComponent).Length) {
            throw "canonical Todo manifest byte count does not match the downloaded component"
          }
          if ($certifiedHash -ne $expectedHash) {
            throw "certified Todo SHA-256 mismatch: expected $expectedHash, got $certifiedHash"
          }
          Write-Host "Todo certified SHA-256: expected $expectedHash, observed $certifiedHash"
          & $cli mount $certifiedComponent
          if ($LASTEXITCODE -ne 0) { throw "certified Todo mount failed" }

          $todo = Join-Path $env:RUNNER_TEMP "youth-todo-host"
          git clone --quiet https://github.com/samanshaiza004/youth-todo.git $todo
          git -C $todo checkout --quiet $env:TODO_COMMIT
          $checkedOut = (git -C $todo rev-parse HEAD).Trim()
          if ($checkedOut -ne $env:TODO_COMMIT) {
            throw "Todo revision mismatch: expected $env:TODO_COMMIT, got $checkedOut"
          }
          Push-Location $todo
          try {
            & $cli check
            if ($LASTEXITCODE -ne 0) { throw "Todo youth check failed" }
            & $cli test --verify-view-convergence
            if ($LASTEXITCODE -ne 0) { throw "Todo convergent youth test failed" }
            & $cli build --release
            if ($LASTEXITCODE -ne 0) { throw "Todo youth build --release failed" }
            $component = Join-Path $todo "dist/dev.saman.todo.wasm"
            if (-not (Test-Path $component -PathType Leaf)) {
              throw "Todo release component was not produced"
            }
            & wasm-tools validate $component
            if ($LASTEXITCODE -ne 0) { throw "Todo component validation failed" }
            if (Select-String -Path Cargo.toml -Pattern 'path\s*=') {
              throw "Todo Cargo.toml contains a local path dependency"
            }
            $forbidden = 'wit_bindgen|bindings::|PatchBatch|tree_revision|acknowledg|NodeId::new|CommandKey::new|NodeKey::new'
            $source = Get-ChildItem src -Recurse -File -Filter *.rs
            if ($source | Select-String -Pattern $forbidden) {
              throw "Todo source contains raw Youth runtime or WIT concepts"
            }
            $lock = Get-Content Youth.lock -Raw
            if ($lock -notmatch 'sdk-revision\s*=\s*"844102bbeadfbbf135e4b9da36423bdc435fbb16"') {
              throw "Todo Youth.lock does not pin the certified collections SDK revision"
            }
            $localHash = (Get-FileHash $component -Algorithm SHA256).Hash.ToLowerInvariant()
            $metadata = Join-Path $env:RUNNER_TEMP "todo-sha-$env:RUNNER_OS.txt"
            Set-Content -Path $metadata -Value $certifiedHash -NoNewline
            Write-Host "Todo certified revision: $checkedOut"
            Write-Host "Todo component bytes: $((Get-Item $component).Length)"
            Write-Host "Todo locally-built SHA-256: $localHash"
            Write-Host "Todo certified SHA-256: $certifiedHash"
          } finally {
            Pop-Location
          }
      - name: Upload Todo identity
        uses: actions/upload-artifact@v4
        with:
          name: todo-sha-${{ runner.os }}
          path: ${{ runner.temp }}/todo-sha-${{ runner.os }}.txt
          if-no-files-found: error
      - name: Ubuntu full dev restart E2E
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cli="$PWD/target/release/youth"
          external="$RUNNER_TEMP/youth-external/tally"
          cd "$external"
          "$cli" activate target/wasm32-wasip2/debug/tally.wasm \
            --node 15700045616422714228 \
            --app-id dev.saman.ci-tally --state-dir .youth/state
          xvfb-run -a bash -c 'echo $$ > .youth-dev.pid; exec "$1" dev' _ "$cli" >dev.log 2>&1 &
          dev_wrapper=$!
          for attempt in $(seq 1 120); do
            grep -q 'dev: watching' dev.log && break
            sleep 0.25
          done
          grep -q 'dev: watching' dev.log
          printf '\n// CI supervisor edit\n' >> src/lib.rs
          for attempt in $(seq 1 120); do
            grep -q 'dev: restarted' dev.log && break
            sleep 0.25
          done
          grep -q 'dev: restarted' dev.log
          dev_pid=$(cat .youth-dev.pid)
          kill -INT "$dev_pid"
          wait "$dev_wrapper"
          "$cli" mount target/wasm32-wasip2/debug/tally.wasm \
            --app-id dev.saman.ci-tally --state-dir .youth/state | grep 'Count: 1'
      - name: Clean tracked tree
        shell: bash
        run: |
          git status --short
          test -z "$(git status --short)"

  calculator-cross-platform:
    needs: host
    runs-on: ubuntu-latest
    steps:
      - name: Download calculator identities
        uses: actions/download-artifact@v4
        with:
          pattern: calculator-sha-*
          path: calculator-identities
          merge-multiple: true
      - name: Require one calculator component identity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find calculator-identities -type f -name '*.txt' -print | sort)
          test "${#files[@]}" -eq 3
          mapfile -t hashes < <(for file in "${files[@]}"; do tr -d '\r\n' < "$file"; printf '\n'; done | sort -u)
          test "${#hashes[@]}" -eq 1
          [[ "${hashes[0]}" =~ ^[0-9a-f]{64}$ ]]
          echo "calculator component SHA-256 is identical on all hosts: ${hashes[0]}"

  todo-cross-platform:
    needs: host
    runs-on: ubuntu-latest
    steps:
      - name: Download Todo identities
        uses: actions/download-artifact@v4
        with:
          pattern: todo-sha-*
          path: todo-identities
          merge-multiple: true
      - name: Require one certified Todo component identity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find todo-identities -type f -name '*.txt' -print | sort)
          test "${#files[@]}" -eq 3
          mapfile -t hashes < <(for file in "${files[@]}"; do tr -d '\r\n' < "$file"; printf '\n'; done | sort -u)
          test "${#hashes[@]}" -eq 1
          [[ "${hashes[0]}" =~ ^[0-9a-f]{64}$ ]]
          echo "the exact certified Todo component ran on all hosts: ${hashes[0]}"
