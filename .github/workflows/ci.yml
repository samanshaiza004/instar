name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build the guest component once; every host job consumes these exact bytes.
  guest:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Build counter component
        run: cargo build -p youth-counter --target wasm32-wasip2 --release
      - name: Record SHA-256
        id: hash
        run: |
          sha256sum target/wasm32-wasip2/release/youth_counter.wasm | tee counter.sha256
          echo "sha256=$(cut -d' ' -f1 counter.sha256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: counter-wasm
          path: |
            target/wasm32-wasip2/release/youth_counter.wasm
            counter.sha256
          if-no-files-found: error

  host:
    needs: guest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build (release)
        run: cargo build --workspace --release
