#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "read"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan-output.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
      - name: "[configuration] Verify release workflow is synchronized"
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=configuration stage failed::release.yml and dist-workspace.toml are out of sync"' ERR
          python scripts/check-release-sync.py --plan plan-dist-manifest.json
          echo "release configuration is synchronized"
      - id: plan-output
        shell: bash
        run: |
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    permissions:
      "attestations": "write"
      "contents": "read"
      "id-token": "write"
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ join(matrix.targets, '-') }}
          cache-provider: ${{ matrix.cache_provider }}
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: "[build] Compile release instar binary"
        shell: bash
        env:
          TARGET: ${{ join(matrix.targets, '') }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=build stage failed::release instar binary did not compile for $TARGET"' ERR
          cargo build --locked --profile dist --target "$TARGET" --package instar-shell --bin instar
          echo "release instar binary built for $TARGET"
      - name: "[package] Build distribution artifact"
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=package stage failed::cargo-dist could not package ${{ join(matrix.targets, '') }}"' ERR
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "distribution artifact packaged for ${{ join(matrix.targets, '') }}"
      - id: verify
        name: "[install/execute] Verify archive, install binary, and run CLI help"
        shell: bash
        env:
          TARGET: ${{ join(matrix.targets, '') }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=install or execute stage failed::release archive verification failed for $TARGET"' ERR
          python scripts/verify-release-artifact.py --target "$TARGET" --distribution-dir target/distrib --install-dir target/release-install
      - id: attest
        name: "[attestation] Generate GitHub artifact attestation"
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.verify.outputs.archive }}
      - name: "[attestation] Verify GitHub artifact attestation"
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          ARCHIVE: ${{ steps.verify.outputs.archive }}
          BUNDLE_PATH: ${{ steps.attest.outputs['bundle-path'] }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "$BUNDLE_PATH" ] || [ ! -f "$BUNDLE_PATH" ]; then
            echo "::error title=attestation stage failed::actions/attest did not produce a verification bundle" >&2
            exit 1
          fi
          gh attestation verify "$ARCHIVE" --bundle "$BUNDLE_PATH" --repo "$GITHUB_REPOSITORY"
          echo "attestation verified for $(basename "$ARCHIVE")"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
            ${{ steps.verify.outputs.size_report }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    permissions:
      "contents": "read"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=package stage failed::cargo-dist could not generate global release checksums"' ERR
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "global release checksums packaged"

          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "[package] Verify all release checksums and sizes"
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=package stage failed::release checksum verification failed"' ERR
          python scripts/verify-release-artifact.py --all-checksums --distribution-dir target/distrib
          {
            echo "## Release artifact sizes"
            echo
            echo "| Target | Archive | Archive bytes | Binary | Binary bytes |"
            echo "| --- | --- | ---: | --- | ---: |"
            for report in target/distrib/release-size-*.tsv; do
              tail -n +2 "$report" | awk -F '\t' '{ printf "| %s | %s | %s | %s | %s |\\n", $1, $2, $3, $4, $5 }'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Execute both generated installers in isolated CARGO_HOME directories. This
  # proves the release scripts install the one runtime binary and do not depend
  # on the repository checkout or modify the runner's normal toolchain.
  installer-smoke:
    needs:
      - plan
      - build-global-artifacts
      - host
    # Installers point at the public release URL, so test them only after the
    # tag release exists. Pull requests exercise the just-built archives in
    # each native build job above instead.
    if: ${{ needs.plan.result == 'success' && needs.build-global-artifacts.result == 'success' && needs.host.result == 'success' && needs.plan.outputs.publishing == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    permissions:
      "contents": "read"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-build-global
          path: release-assets
      - name: Smoke-test shell installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -Eeuo pipefail
          smoke_root="$(mktemp -d)"
          export CARGO_HOME="$smoke_root/cargo"
          export INSTAR_SHELL_NO_MODIFY_PATH=true
          sh release-assets/instar-shell-installer.sh
          test -x "$CARGO_HOME/bin/instar"
          "$CARGO_HOME/bin/instar" --help >/dev/null
          test ! -e "$CARGO_HOME/bin/overhead"
          test ! -e "$CARGO_HOME/bin/uibench"
      - name: Smoke-test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'instar-installer-smoke'
          $env:CARGO_HOME = Join-Path $smokeRoot 'cargo'
          $env:INSTAR_SHELL_NO_MODIFY_PATH = 'true'
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          & (Join-Path $PWD 'release-assets/instar-shell-installer.ps1')
          $binary = Join-Path $env:CARGO_HOME 'bin/instar.exe'
          if (-not (Test-Path $binary)) { throw "installer did not create $binary" }
          & $binary --help | Out-Null
          if (Test-Path (Join-Path $env:CARGO_HOME 'bin/overhead.exe')) { throw 'installer shipped overhead.exe' }
          if (Test-Path (Join-Path $env:CARGO_HOME 'bin/uibench.exe')) { throw 'installer shipped uibench.exe' }
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    permissions:
      "contents": "write"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
          # Size reports are CI diagnostics, not release assets.
          rm -f artifacts/release-size-*.tsv
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"

          release_args=("${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt")
          if [[ -n "$PRERELEASE_FLAG" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}" artifacts/*

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      "contents": "read"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

  # Verify the assets after they have been downloaded from the actual GitHub
  # Release. Local checks above catch packaging regressions; this catches an
  # upload or release-assembly mistake as well and verifies the public
  # provenance attached to every native archive.
  release-proof:
    needs:
      - plan
      - host
    if: ${{ needs.plan.result == 'success' && needs.host.result == 'success' && needs.plan.outputs.publishing == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      "attestations": "read"
      "contents": "read"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Download published release assets
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release
      - name: Verify published checksums and report sizes
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd release && sha256sum --check --strict sha256.sum)
          for checksum in release/*.sha256; do
            (cd release && sha256sum --check --strict "$(basename "$checksum")")
          done
          {
            echo "## Published Instar artifact sizes"
            echo
            echo "| Asset | Bytes |"
            echo "| --- | ---: |"
            find release -maxdepth 1 -type f -printf '%f\t%s\n' | sort | awk -F '\t' '{ printf "| %s | %s |\\n", $1, $2 }'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify published archive attestations
        shell: bash
        run: |
          set -Eeuo pipefail
          for archive in release/instar-shell-*.tar.xz release/instar-shell-*.zip; do
            [ -f "$archive" ] || continue
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          done
