[workspace]
resolver = "3"
members = [
    "crates/youth-tree",
    "crates/youth-sdk",
    "crates/youth-interaction",
    "crates/youth-editor-engine",
    "crates/youth-text-render-cpu",
    "crates/instar-paint",
    "crates/instar-render-vello-cpu",
    "crates/instar-kernel",
    "crates/instar-ui",
    "crates/instar-ui-protocol",
]

# youth-runtime and youth-desktop are temporarily out of the workspace: both
# have a stale path dependency on the deleted youth-state crate, and both are
# source-only salvage material for Instar Phase 1 (instar-kernel extracted its
# engine-config seed from youth-runtime in WP2; instar-window/instar-host will
# extract from youth-desktop in WP6/WP7) rather than crates that get fixed in
# place. Their files remain on disk for reference; re-add or delete them once
# WP6/WP7 land.

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/samanshaiza004/instar"

[profile.release]
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Local benchmark profile: the release profile's fat LTO makes `cargo bench`
# link the full youth-desktop dependency graph (winit/tokio/vello_cpu/accesskit)
# impractically slowly. Thin LTO keeps cross-crate optimization for the
# measured code while keeping `cargo bench` usable on a developer machine.
# Shipped `release`/`dist` profiles are unaffected.
[profile.bench]
inherits = "release"
lto = "thin"
