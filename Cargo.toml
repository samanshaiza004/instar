[workspace]
resolver = "3"
members = [
    "crates/youth-tree",
    "crates/youth-runtime",
    "crates/youth-cli",
    "guests/counter",
    "test-components/trap-on-mount",
    "test-components/trap-on-handle",
    "test-components/invalid-snapshot",
    "test-components/invalid-patch",
    "test-components/infinite-loop",
    "test-components/memory-bomb",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
lto = true
