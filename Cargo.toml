[workspace]
resolver = "3"
members = [
    "crates/youth-tree",
    "crates/youth-state",
    "crates/youth-sdk",
    "crates/youth-project",
    "crates/youth-capsule",
    "crates/youth-test",
    "crates/youth-runtime",
    "crates/youth-interaction",
    "crates/youth-editor-engine",
    "crates/youth-text-render-cpu",
    "crates/youth-desktop",
    "crates/youth-cli",
    "guests/counter",
    "test-components/legacy-v003",
    "test-components/sdk-tally",
    "test-components/sdk-todo",
    "test-components/sdk-time",
    "test-components/sdk-editor",
    "test-components/time-stub",
    "test-components/instant-now",
    "test-components/trap-on-mount",
    "test-components/trap-on-handle",
    "test-components/invalid-snapshot",
    "test-components/invalid-patch",
    "test-components/infinite-loop",
    "test-components/memory-bomb",
    "test-components/invalid-revision",
    "test-components/invalid-sequence",
    "test-components/oversized-snapshot",
    "test-components/oversized-patch",
    "test-components/trap-after-state-write",
    "test-components/invalid-patch-after-state-write",
    "test-components/bad-revision-after-state-write",
    "test-components/app-error-after-state-write",
    "test-components/sdk-elapsed",
    "test-components/countdown-presentation",
    "test-components/editor-v006",
    "test-components/editor-capability-v006",
    "test-components/shortcut-primary-v007",
    "test-components/sdk-text-document",
    "test-components/elapsed-trap",
    "test-components/elapsed-invalid-patch",
]
exclude = ["crates/youth-cli/templates/tally"]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/samanshaiza004/youth"

[profile.release]
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
