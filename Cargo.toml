[workspace]
resolver = "3"
members = [
    "crates/instar-paint",
    "crates/instar-render-vello-cpu",
    "crates/instar-kernel",
    "crates/instar-ui",
    "crates/instar-ui-protocol",
    "crates/instar-sdk",
    "crates/instar-window",
    "crates/instar-host",
    "crates/instar-shell",
    "crates/instar-guest-build",
]

# The predecessor's crates are gone as of WP10. Every one was either salvaged
# (instar-kernel's engine config from youth-runtime; instar-window and
# instar-host from youth-desktop; instar-paint and instar-render-vello-cpu
# renamed wholesale in WP0.4) or superseded, and nothing in Instar linked any
# of them -- only comments referred to them, which they still do, because
# provenance is worth keeping.
#
# The source is not lost: it is all at the `managed-youth-final` tag (78650bc),
# which is also what docs/baselines/ measures against.

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/samanshaiza004/instar"

[profile.release]
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Local benchmark profile: the release profile's fat LTO makes `cargo bench`
# link the full youth-desktop dependency graph (winit/tokio/vello_cpu/accesskit)
# impractically slowly. Thin LTO keeps cross-crate optimization for the
# measured code while keeping `cargo bench` usable on a developer machine.
# Shipped `release`/`dist` profiles are unaffected.
[profile.bench]
inherits = "release"
lto = "thin"
