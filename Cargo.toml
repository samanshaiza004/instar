[workspace]
resolver = "3"
members = [
    "crates/youth-tree",
    "crates/youth-state",
    "crates/youth-sdk",
    "crates/youth-project",
    "crates/youth-test",
    "crates/youth-runtime",
    "crates/youth-interaction",
    "crates/youth-desktop",
    "crates/youth-cli",
    "guests/counter",
    "test-components/legacy-v003",
    "test-components/sdk-tally",
    "test-components/sdk-time",
    "test-components/time-stub",
    "test-components/trap-on-mount",
    "test-components/trap-on-handle",
    "test-components/invalid-snapshot",
    "test-components/invalid-patch",
    "test-components/infinite-loop",
    "test-components/memory-bomb",
    "test-components/invalid-revision",
    "test-components/invalid-sequence",
    "test-components/oversized-snapshot",
    "test-components/oversized-patch",
    "test-components/trap-after-state-write",
    "test-components/invalid-patch-after-state-write",
    "test-components/bad-revision-after-state-write",
    "test-components/app-error-after-state-write",
]
exclude = ["crates/youth-cli/templates/tally"]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
lto = true
