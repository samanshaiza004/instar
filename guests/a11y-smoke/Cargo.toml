[package]
name = "a11y-smoke"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Instar's accessibility smoke fixture: the compact tree F4 drives a real screen reader against. Not part of the Instar workspace; targets wasm32-wasip2."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.60.0"
# The wire format, and nothing else. A guest speaks the encoding; it never
# links the host's UI implementation, its layout engine, or its hit-testing.
# See docs/PHASE-1.md, "UI layering".
instar-ui-protocol = { path = "../../crates/instar-ui-protocol" }

[workspace]
