[package]
name = "calculator"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Instar's calculator: the application that answers whether Instar is pleasant to write against. Not part of the Instar workspace; targets wasm32-wasip2."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.60.0"
# The wire format, and nothing else. A guest speaks the encoding; it never
# links the host's UI implementation, its layout engine, or its hit-testing.
# See docs/PHASE-1.md, "UI layering".
instar-ui-protocol = { path = "../../crates/instar-ui-protocol" }
# The thin builder. Optional everywhere else -- the Gallery and the counter
# still hand-encode -- and used here because this is the application whose
# complaints it was built from.
instar-sdk = { path = "../../crates/instar-sdk" }

[workspace]
