[package]
name = "kernel-spike-guest"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Gate 0 spike guest fixture. Not part of the Instar workspace: it targets wasm32-wasip2 and is built on demand by instar-kernel's build script."

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned per docs/TOOLCHAIN.md -- 0.60.0 specifically, for the async
# cancellation and async-lifted-export fixes Gate 0 exercises.
wit-bindgen = "0.60.0"
# Guest-side concurrency primitive. Needed so the guest can await two async
# imports *simultaneously* within one task, which is what proves the
# Component Model's concurrency rather than the host's.
futures = { version = "0.3", default-features = false, features = ["alloc"] }

# Deliberately its own workspace root: this crate must not be pulled into the
# outer Instar workspace (different target, different profile, and it would
# otherwise force wit-bindgen into the host dependency graph).
[workspace]
