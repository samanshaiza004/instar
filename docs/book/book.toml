[book]
title = "Instar Guide"
authors = ["Instar contributors"]
description = "Install, run, build, and understand Instar applications."
language = "en"
src = "src"

[build]
build-dir = "../../target/mdbook"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/instar.css"]
git-repository-url = "https://github.com/samanshaiza004/instar"
edit-url-template = "https://github.com/samanshaiza004/instar/edit/master/docs/book/{path}"
site-url = "/docs/"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
