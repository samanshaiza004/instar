[build]
  # Netlify's project is configured with `website` as its base directory.
  # Keep the command and publish path relative to that directory so the
  # dashboard configuration and this file agree.
  base = "website"
  command = "bash build.sh"
  publish = "dist"

[[redirects]]
  from = "/install"
  to = "/install.sh"
  status = 200

[[headers]]
  for = "/install.sh"
  [headers.values]
    Content-Type = "text/x-shellscript; charset=utf-8"
    Cache-Control = "public, max-age=300"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # mdBook uses small inline boot scripts for theme and search state.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'"
