[build]
  # Netlify's project is configured with `website` as its base directory.
  # Keep the command and publish path relative to that directory so the
  # dashboard configuration and this file agree.
  base = "website"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Stable installer entry points. `/install` is the documented short form; the
# scripts themselves are static files in website/public/.
[[redirects]]
  from = "/install"
  to = "/install.sh"
  status = 200

# The guide moved from mdBook to Starlight, which serves clean URLs. Keep every
# published `.html` address working: these were linked from READMEs, from the
# installer's own error output, and from anywhere else outside this repository.
[[redirects]]
  from = "/docs/index.html"
  to = "/docs/"
  status = 301

[[redirects]]
  from = "/docs/getting-started/requirements.html"
  to = "/docs/getting-started/requirements"
  status = 301

[[redirects]]
  from = "/docs/getting-started/install.html"
  to = "/docs/getting-started/install"
  status = 301

[[redirects]]
