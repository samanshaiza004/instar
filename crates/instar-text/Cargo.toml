[package]
name = "instar-text"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Instar's text resource subsystem: buffers, views, revisions and editing. A host subsystem independent of the semantic UI tree, composed with instar-ui by instar-host."

[dependencies]
# A B-tree rope. Chosen for its byte-offset editing API, which is what the
# revision protocol carries; the alternative ropes index by char. Confined
# entirely to src/storage.rs -- no `crop` type appears in this crate's public
# API, so a later measurement can replace it without touching TextBuffer.
crop = { version = "0.4.3", features = ["graphemes"] }
thiserror = "2"
