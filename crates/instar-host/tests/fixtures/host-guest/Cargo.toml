[package]
name = "host-guest"
version = "0.0.0"
edition = "2021"
license = "MPL-2.0"
publish = false
description = "WP7B1 bridge guest fixture: a counter whose buttons also start bulk host work and trap on purpose. Not part of the Instar workspace; targets wasm32-wasip2 and is built on demand by instar-host's build script."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.60.0"
# The wire format only. A guest speaks the encoding; it never links the host's
# UI implementation, its layout engine, or its hit-testing.
instar-ui-protocol = { path = "../../../../instar-ui-protocol" }

[workspace]
