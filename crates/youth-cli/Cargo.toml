[package]
name = "youth-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Thin inspection and test surface for the Youth runtime."

[[bin]]
name = "youth"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6.0.0"
serde_json = "1.0.150"
sha2 = "0.10.9"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "signal", "time"] }
toml = "0.9.12"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
youth-runtime = { path = "../youth-runtime" }
youth-project = { path = "../youth-project" }
youth-state = { path = "../youth-state" }
youth-test = { path = "../youth-test" }
youth-tree = { path = "../youth-tree" }
youth-desktop = { path = "../youth-desktop" }

[dev-dependencies]
tempfile = "3.27.0"
