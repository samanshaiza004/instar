[package]
name = "youth-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Thin inspection and test surface for the Youth runtime."

[[bin]]
name = "youth"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
youth-runtime = { path = "../youth-runtime" }
youth-tree = { path = "../youth-tree" }
