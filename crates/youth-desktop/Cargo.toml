[package]
name = "youth-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

# This crate's `[[bin]]` target is a dev/test-only smoke harness; the shipped
# `youth` product binary (crates/youth-cli) links this crate as a library and
# re-execs itself (std::env::current_exe()) for `youth run`/`youth dev`, so a
# separate `youth-desktop` executable is never invoked in production. Exclude
# it from dist so only `youth` is packaged and distributed.
[package.metadata.dist]
dist = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "youth-desktop"
path = "src/main.rs"

[dependencies]
accesskit = "0.24"
accesskit_winit = "0.33"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["rt", "sync"] }
tracing = "0.1.44"
softbuffer = "0.4.8"
taffy = "0.12"
winit = "=0.30.12"
youth-runtime = { path = "../youth-runtime" }
youth-interaction = { path = "../youth-interaction" }
youth-tree = { path = "../youth-tree" }
youth-text-render-cpu = { path = "../youth-text-render-cpu" }
youth-paint = { path = "../youth-paint" }

# The portal backend avoids a GTK build-time dependency and is suitable for
# later Flatpak/AppImage packaging. rfd may fall back to Zenity if the portal
# is unavailable at runtime.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

[dev-dependencies]
# Test-only: constructs a real TextPresentation to exercise draw_editor_presentation
# end-to-end. Not a production dependency -- the youth-desktop binary itself never
# imports youth-editor-engine (see raster.rs's editor_rasterizer field docs).
youth-editor-engine = { path = "../youth-editor-engine" }
