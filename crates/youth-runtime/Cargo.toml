[package]
name = "youth-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Youth host runtime: Wasmtime engine, component loading, WIT bindings, closed WASI context, serialized app worker."

[features]
test-support = ["youth-state/test-support"]

[dependencies]
accesskit = "0.24"
arboard = { version = "3.6", default-features = false }
cap-std = "4.0.2"
cap-tempfile = "4.0.2"
notify-rust = "4.18.0"
sha2 = "0.10.9"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["rt", "sync", "macros", "rt-multi-thread"] }
tracing = "0.1.44"
wasmtime = "46"
wasmtime-wasi = "46"
youth-tree = { path = "../youth-tree" }
youth-state = { path = "../youth-state" }
youth-editor-engine = { path = "../youth-editor-engine" }

[dev-dependencies]
criterion = "0.5.1"
tempfile = "3.27.0"
tracing-subscriber = "0.3.23"
wat = "1.253.0"
youth-sdk = { path = "../youth-sdk" }
youth-interaction = { path = "../youth-interaction" }

[[bench]]
name = "editor_performance"
harness = false
