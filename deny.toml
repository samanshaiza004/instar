[graph]
all-features = true

[advisories]
version = 2
# Current chain: winit -> sctk-adwaita -> ab_glyph -> owned_ttf_parser ->
# ttf-parser. There is no patched release; remove this exception when the
# stack no longer depends on ttf-parser (or the host adopts an alternative).
ignore = ["RUSTSEC-2026-0192"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
